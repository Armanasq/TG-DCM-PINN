[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-dcm"
version = "0.1.0"
description = "Target-gated direction-cosine physics for six-axis inertial attitude estimation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Arman Asgharpoor Golroudbari", email = "ai-team@ginkoq.com" },
]
keywords = [
    "attitude estimation",
    "direction cosine matrix",
    "inertial measurement unit",
    "physics-informed learning",
    "robotics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<3",
    "torch>=2.1",
]

[project.optional-dependencies]
data = [
    "h5py>=3.8",
    "pandas>=1.5",
    "requests>=2.31",
    "scipy>=1.10",
    "tqdm>=4.65",
]
train = [
    "h5py>=3.8",
    "pytorch-optimizer>=3,<4",
    "tsfast>=0.3,<0.4",
    "tqdm>=4.65",
]
evaluation = [
    "h5py>=3.8",
    "matplotlib>=3.7",
    "onnxruntime>=1.16",
    "pandas>=1.5",
    "riann>=0.1.3,<0.2",
    "vqf>=2,<3",
]
all = [
    "h5py>=3.8",
    "matplotlib>=3.7",
    "onnxruntime>=1.16",
    "pandas>=1.5",
    "pytorch-optimizer>=3,<4",
    "requests>=2.31",
    "riann>=0.1.3,<0.2",
    "scipy>=1.10",
    "tqdm>=4.65",
    "tsfast>=0.3,<0.4",
    "vqf>=2,<3",
]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.14",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/GinkgoQ/TG-DCM-PINN"
Repository = "https://github.com/GinkgoQ/TG-DCM-PINN"
Issues = "https://github.com/GinkgoQ/TG-DCM-PINN/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
